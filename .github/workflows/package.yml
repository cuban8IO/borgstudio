name: package

# Reusable: builds the portable, self-contained packages for all platforms.
# build.yml calls it to check packaging on every change, release.yml to publish the result.
on:
  workflow_call:
    inputs:
      version:
        description: Version baked into the binaries and file names
        required: true
        type: string
      macos:
        # macOS runners are scarce and often queue for a long time: build.yml skips the macOS packages,
        # releases always build them.
        description: Also build the macOS app bundles
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
      RID: ${{ matrix.rid }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/BorgStudio.App/BorgStudio.App.csproj -c Release -r "$RID" -p:Version="$VERSION" -o publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "dist/BorgStudio-$env:VERSION-$env:RID.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist staging/BorgStudio
          cp -R publish/. staging/BorgStudio/
          chmod +x staging/BorgStudio/BorgStudio
          tar -czf "dist/BorgStudio-$VERSION-$RID.tar.gz" -C staging BorgStudio

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Both macOS bundles (Apple Silicon and Intel) in one job, so a release needs only one macOS runner.
  package-macos:
    name: package (macOS)
    if: inputs.macos
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish and package
        run: |
          mkdir -p dist
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/BorgStudio.App/BorgStudio.App.csproj -c Release -r "$rid" -p:Version="$VERSION" -o "publish/$rid"
            app="staging/$rid/BorgStudio.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp -R "publish/$rid/." "$app/Contents/MacOS/"
            chmod +x "$app/Contents/MacOS/BorgStudio"
            sed "s/@VERSION@/$VERSION/g" build/macos/Info.plist > "$app/Contents/Info.plist"
            cp build/macos/BorgStudio.icns "$app/Contents/Resources/"
            plutil -lint "$app/Contents/Info.plist"
            # Ad-hoc signature (required on Apple Silicon). Not notarized: Gatekeeper still asks on first start.
            codesign --force --sign - "$app"
            codesign --verify --verbose "$app"
            ditto -c -k --keepParent "$app" "dist/BorgStudio-$VERSION-$rid.zip"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: package-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7
