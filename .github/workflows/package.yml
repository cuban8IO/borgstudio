name: package

# Reusable: builds the portable, self-contained packages for all platforms.
# build.yml calls it to check packaging on every change, release.yml to publish the result.
on:
  workflow_call:
    inputs:
      version:
        description: Version baked into the binaries and file names
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
      RID: ${{ matrix.rid }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/BorgStudio.App/BorgStudio.App.csproj -c Release -r "$RID" -p:Version="$VERSION" -o publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "dist/BorgStudio-$env:VERSION-$env:RID.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist staging/BorgStudio
          cp -R publish/. staging/BorgStudio/
          chmod +x staging/BorgStudio/BorgStudio
          tar -czf "dist/BorgStudio-$VERSION-$RID.tar.gz" -C staging BorgStudio

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app=staging/BorgStudio.app
          mkdir -p dist "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R publish/. "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/BorgStudio"
          sed "s/@VERSION@/$VERSION/g" build/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # Ad-hoc signature (required on Apple Silicon). Not notarized: Gatekeeper still asks on first start.
          codesign --force --sign - "$app"
          codesign --verify --verbose "$app"
          ditto -c -k --keepParent "$app" "dist/BorgStudio-$VERSION-$RID.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
