name: pages

# Publishes the product page (site/) on GitHub Pages: when it changes on main, after every release (so the
# fallback version.json names the new version) and by hand. The page itself asks GitHub for the newest release
# when it is opened; version.json is only used when that fails.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/scripts/build-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '{version: (.tag_name | ltrimstr("v")), date: .published_at, assets: [.assets[] | {name, url: .browser_download_url, size}]}' \
            > site/version.json || echo '{}' > site/version.json
          cat site/version.json

      # The German page, structured data and the sitemap (no dependencies, the runner's Node is enough).
      - name: Build
        run: node .github/scripts/build-site.mjs site _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
