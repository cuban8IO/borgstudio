name: build

# Build, test and package check for every branch except main (main is handled by release.yml).
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BorgStudio.slnx

      - name: Build
        run: dotnet build BorgStudio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BorgStudio.slnx --configuration Release --no-build

  package:
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.0-ci.${{ github.run_number }}
