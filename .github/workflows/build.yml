name: build

# Build, test and package check for every branch except main (main is handled by release.yml).
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BorgStudio.slnx

      - name: Build
        run: dotnet build BorgStudio.slnx --configuration Release --no-restore

      # Real borg for the integration tests and a Secret Service for the keychain tests.
      - name: Install borg and a keyring (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y borgbackup gnome-keyring dbus-x11 libsecret-1-0

      # A throw-away SSH account with password login on this throw-away runner, for the SSH integration tests.
      - name: Start an SSH server (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y openssh-server
          sudo useradd --create-home --shell /bin/bash borgtest
          echo 'borgtest:ci-only-password' | sudo chpasswd
          printf 'PasswordAuthentication yes\nKbdInteractiveAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/00-borgstudio-ci.conf
          sudo systemctl restart ssh

      # The commands a Hetzner Storage Box offers: install-ssh-key (public key on standard input) and borg-1.4.
      - name: Mimic Storage Box commands (Linux)
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' '#!/bin/sh' 'set -e' 'umask 077' 'mkdir -p "$HOME/.ssh"' 'cat >> "$HOME/.ssh/authorized_keys"' \
            | sudo tee /usr/local/bin/install-ssh-key
          sudo chmod 755 /usr/local/bin/install-ssh-key
          sudo ln -s "$(command -v borg)" /usr/local/bin/borg-1.4

      # An unlocked keychain without auto-lock, so the keychain tests never wait for a password dialog.
      - name: Prepare keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci-only build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-only build.keychain
          security set-keychain-settings build.keychain

      - name: Test
        if: runner.os != 'Linux'
        env:
          BORGSTUDIO_KEYCHAIN_TESTS: "1"
        run: dotnet test BorgStudio.slnx --configuration Release --no-build

      - name: Test (Linux, with Secret Service and SSH server)
        if: runner.os == 'Linux'
        env:
          BORGSTUDIO_KEYCHAIN_TESTS: "1"
          BORGSTUDIO_SSH_TEST_HOST: localhost
          BORGSTUDIO_SSH_TEST_USER: borgtest
          BORGSTUDIO_SSH_TEST_PASSWORD: ci-only-password
          BORGSTUDIO_SSH_TEST_STORAGE_BOX: "1"
        run: |
          dbus-run-session -- bash -c '
            echo -n ci-only | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            dotnet test BorgStudio.slnx --configuration Release --no-build'

  package:
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.0-ci.${{ github.run_number }}
